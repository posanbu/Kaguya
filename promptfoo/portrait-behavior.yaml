description: 人物认识端到端对照。原始对话形成认识，发布后冻结读取，再检查实际回答。
prompts:
  - "评测 {{caseId}}"
providers:
  - id: file://portrait-behavior-provider.cjs
    label: 改进模板
    config:
      variant: candidate
      reasoning: minimal
  - id: file://portrait-behavior-provider.cjs
    label: 基线模板
    config:
      variant: baseline
      reasoning: minimal
tests: file://portrait-behavior-cases.json
defaultTest:
  assert:
    - type: javascript
      value: "context.providerResponse.metadata.valid === true"
evaluateOptions:
  maxConcurrency: 2
