name: Test

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 3

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check documentation
        run: pnpm docs:check

  quality:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verify situation contract artifacts
        run: pnpm contracts:check

      - name: Typecheck
        run: pnpm typecheck

  pr-contracts:
    name: PR contracts and startup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace types
        run: pnpm exec tsc -b

      - name: Run fast contracts and startup tests
        run: >-
          pnpm exec vitest run
          packages/config/src/model.test.ts
          packages/config/src/manager.test.ts
          packages/config/src/module-config.test.ts
          packages/config/src/startup-validation.test.ts
          packages/database/src/schema.test.ts
          packages/database/src/memory-graph.test.ts
          apps/server/src/memory-graph-routes.test.ts
          apps/web/src/memory-graph-model.test.ts
          apps/web/src/memory-graph-colors.test.ts
          apps/web/src/components/AppShell.test.tsx
          packages/modules/src/first-party/router/agent-contracts.test.ts
          packages/modules/src/first-party/situation-model.test.ts
          packages/modules/src/first-party/heartflow/planner.test.ts
          apps/server/src/app.test.ts
          apps/server/src/configuration-application.test.ts
          apps/server/src/feature-management.test.ts
          apps/server/src/server-composition.test.ts

  message-targets:
    name: message targets (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace types
        run: pnpm exec tsc -b

      - name: Test cross-conversation routing and authorization
        run: >-
          pnpm exec vitest run
          apps/server/src/natural-message-targets.test.ts
          apps/server/src/message-targets.test.ts
          packages/modules/src/first-party/router/light.test.ts
          packages/modules/src/node/prompt-templates.test.ts

  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # 按文件拆成两个完整分片，避免真实数据库套件在较慢 runner 上超过作业时限。
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run tests
        run: pnpm test --shard=${{ matrix.shard }}/2

  postgres:
    name: PostgreSQL integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGUYA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run PostgreSQL integration tests
        run: pnpm test:postgres
