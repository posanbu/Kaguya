name: Test

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check documentation
        run: pnpm docs:check

  quality:
    name: lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verify situation contract artifacts
        run: pnpm contracts:check

      - name: Typecheck
        run: pnpm typecheck

  pr-contracts:
    name: PR critical tests (shard ${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      KAGUYA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec tsc -b apps/server

      - name: Run critical tests
        run: >-
          pnpm test:critical --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json --outputFile=critical-results.json

      - name: Require complete critical test results
        run: node scripts/check-critical-test-report.mjs critical-results.json

  pr-contracts-result:
    # 保留原检查名称，供已有分支保护规则继续使用。
    name: PR contracts and startup
    if: always() && github.event_name == 'pull_request'
    needs: pr-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every critical shard to pass
        env:
          RESULT: ${{ needs.pr-contracts.result }}
        run: test "$RESULT" = success

  message-targets:
    name: message targets (ubuntu-latest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec tsc -b apps/server

      - name: Test cross-conversation routing and authorization
        run: >-
          pnpm exec vitest run
          apps/server/src/natural-message-targets.test.ts
          apps/server/src/message-targets.test.ts
          packages/modules/src/first-party/router/light.test.ts
          packages/modules/src/node/prompt-templates.test.ts
          --allowOnly=false --bail=0
          --reporter=default --reporter=json --outputFile=routing-results.json

      - name: Require complete routing test results
        run: node scripts/check-critical-test-report.mjs routing-results.json

  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # 按文件拆成两个完整分片，缩短真实数据库套件的等待时间。
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run tests
        run: pnpm test --shard=${{ matrix.shard }}/2

  postgres:
    name: PostgreSQL integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KAGUYA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run PostgreSQL integration tests
        run: pnpm test:postgres
