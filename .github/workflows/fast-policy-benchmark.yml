name: Fast policy benchmark offline tests

on:
  pull_request:
    paths:
      - "benchmarks/fast-policy/**"
      - ".github/workflows/fast-policy-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test Python runner without credentials or provider access
        run: python3 -m unittest discover -s benchmarks/fast-policy -p 'test_*.py' -v
      - name: Test read-only export boundaries without a database
        run: node --test benchmarks/fast-policy/export_workload.node-test.mjs
      - name: Validate the complete dry-run matrix
        run: >-
          python3 benchmarks/fast-policy/runner.py
          --dataset benchmarks/fast-policy/example.jsonl
          --output .data/fast-policy-ci-dry-run
          --dry-run
