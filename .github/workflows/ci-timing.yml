name: CI timing report
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Test workflow run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # Never execute code from the PR or download its artifacts in this workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node --test scripts/ci-timing-report-checks.mjs
      - name: Collect completed runs and job steps
        run: node scripts/ci-timing-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.run_id }}
          path: ci-report/
          retention-days: 90
          if-no-files-found: error
