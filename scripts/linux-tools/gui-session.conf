<!-- 固定应用 session bus。仅容器内两个 UID 可连接；activation 只读镜像内服务，
     不搜索 HOME/workspace。控制回执始终使用独立私有 socket，不经过此总线。 -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/kaguya-app/session/bus</listen>
  <auth>EXTERNAL</auth>
  <servicedir>/usr/share/dbus-1/services</servicedir>
  <policy context="default">
    <deny user="*"/>
    <allow user="1000"/>
    <allow user="1001"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
